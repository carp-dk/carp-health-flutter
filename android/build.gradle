group 'cachet.plugins.health'
version '1.2'

buildscript {
    ext.kotlin_version = '2.2.10'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 36
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    lintOptions {
        disable 'InvalidPackage'
    }
    namespace "cachet.plugins.health"
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2026.03.01')
    implementation(composeBom)
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    implementation("androidx.health.connect:connect-client:1.2.0-alpha02")
    implementation "androidx.fragment:fragment-ktx:1.8.9"

    def flutterSdk = findProperty("flutter.sdk") ?: System.getenv("FLUTTER_ROOT") ?: System.getenv("FLUTTER_HOME")
    def localPropertiesFile = rootProject.file("local.properties")
    if (localPropertiesFile.exists()) {
        def localProperties = new Properties()
        localPropertiesFile.withInputStream { localProperties.load(it) }
        def localFlutterSdk = localProperties.getProperty("flutter.sdk")
        if (localFlutterSdk != null) {
            flutterSdk = localFlutterSdk
        }
    }
    if (flutterSdk == null) {
        def examplePropertiesFile = rootProject.file("../example/android/local.properties")
        if (examplePropertiesFile.exists()) {
            def exampleProperties = new Properties()
            examplePropertiesFile.withInputStream { exampleProperties.load(it) }
            def exampleFlutterSdk = exampleProperties.getProperty("flutter.sdk")
            if (exampleFlutterSdk != null) {
                flutterSdk = exampleFlutterSdk
            }
        }
    }
    if (flutterSdk != null) {
        def flutterJar = file("$flutterSdk/bin/cache/artifacts/engine/android-arm64/flutter.jar")
        if (flutterJar.exists()) {
            compileOnly files(flutterJar)
            testImplementation files(flutterJar)
        }
    }

    testImplementation "junit:junit:4.13.2"

}
